services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: hrx
      POSTGRES_USER: hrx
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hrx_dev}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-hrx}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-hrx_dev_secret}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
volumes:
  pgdata:
  miniodata:
